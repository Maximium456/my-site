<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WW2 Movie Production Site</title>
</head>
<body>

 <p>Hello, welcome to the officail site of the WW2 Movie Production.</p>

  <script>
    // Map codes to URLs
    const codeMap = {
      "62735": "https://docs.google.com/presentation/d/1BM73xGGIuBj7_Gv9Wstxt_LSf998UcNm-iookgK40bI/edit",
      "3737": "https://docs.google.com/document/d/1N-KttV0sPHHWnFNrRBM8xuBB-JYBKQZB5a2U6Ft6ETc/edit?usp=sharing",
      "secret": ""
    };

    document.addEventListener("keydown", function (event) {
      if (event.key === "Tab" && event.shiftKey) {
        event.preventDefault();

        alert("Access prompt opened. Enter your code next.");
        const code = prompt("Enter access code:");

        if (!code) {
          alert("No code entered.");
          return;
        }

        if (codeMap[code]) {
          window.location.href = codeMap[code];
        } else {
          alert("Invalid code. Access denied.");
        }
      }
    });
  </script>
</body>
